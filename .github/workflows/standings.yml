name: Update standings

on:
  schedule:
    - cron: "0 11 * * *" # daily at 11:00 UTC (7 AM ET), after the previous night's games
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch standings from Basketball-Reference
        run: python scripts/fetch_standings.py 2027 data/standings.json

      - name: Commit updated standings
        run: |
          git config user.name "standings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet && exit 0
          git commit -m "Update standings $(date -u +%Y-%m-%d)"
          git push
